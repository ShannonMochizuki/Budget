<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#162238"><title>Budget Compass Recovery</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f8;color:#172033;margin:0;padding:24px}main{max-width:520px;margin:auto;background:#fff;border:1px solid #dde2e8;border-radius:16px;padding:20px}h1{font-size:22px;margin-top:0}.muted{color:#697386}.ok{color:#237a57}button{min-height:44px;border:0;border-radius:12px;background:#355c9a;color:#fff;padding:10px 16px;font-size:16px}</style></head><body><main><h1>Budget Compass recovery</h1><p id="status" class="muted">Clearing the old app cache and service worker…</p><button id="retry" hidden>Open Budget Compass</button></main><script>(async()=>{const s=document.getElementById('status'),b=document.getElementById('retry');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/Budget/')).map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('budget-compass-')).map(k=>caches.delete(k)))}s.textContent='Old Budget Compass cache cleared. Opening v1.0.4…';s.className='ok';setTimeout(()=>location.replace('/Budget/?v=1.0.4'),700)}catch(e){s.textContent='Automatic cleanup could not finish. Tap below to continue.';b.hidden=false}b.onclick=()=>location.href='/Budget/?v=1.0.4'})();</script></body></html>
